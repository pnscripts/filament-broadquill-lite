name: CI

# Every push to main and every pull request. A library commits no
# composer.lock, so each run resolves the newest versions the constraints
# allow: what a new install gets. That is how a Filament release that changes
# a method this package overrides is caught here, not by the people using it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a new Filament or Laravel release is tried even when nothing
    # here changed.
    - cron: '0 5 * * 1'

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }}${{ matrix.filament && format(', Filament {0}, Laravel {1}', matrix.filament, matrix.laravel) || '' }}
    runs-on: ubuntu-latest
    # A hung step (network, installer) stops here, not after GitHub's 6 hours.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Only include entries, so each one is its own job. The package needs
        # PHP 8.3 or newer; without a pin, 8.3 and 8.4 both resolve the newest
        # Filament 5 on Laravel 13.
        include:
          - php: '8.3'
          - php: '8.4'
          # Filament 4 on Laravel 12 is still supported, so it is pinned and
          # tested on the lowest PHP. Releases before Filament 4.13 fail with
          # the Livewire they install, which is why composer.json starts there.
          - php: '8.3'
            filament: '^4.13'
            laravel: '^12.0'
    steps:
      # Actions are pinned to commit hashes, so a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token is not kept in .git/config.
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, intl, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Pin Filament and Laravel
        if: matrix.filament
        run: composer require --no-update --no-interaction "filament/filament:${{ matrix.filament }}" "illuminate/support:${{ matrix.laravel }}"
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Composer audit
        run: composer audit
      - name: Static analysis
        run: composer analyse
      - name: Tests
        run: composer test
